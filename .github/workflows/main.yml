name: Build prospero-win

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang make python3 python3-yaml git

      - name: Check setup
        run: python3 tools/check_setup.py

      - name: Run host tests and checks
        run: make -j2 all

      - name: Build PS5 app
        run: tools/build_native.sh

      - name: Build Wine PS5 modules
        run: tools/build_wine_ps5.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prospero-win-build
          path: |
            build/
            dist/
            *.zip
